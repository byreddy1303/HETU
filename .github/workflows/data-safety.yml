name: Data safety

on:
  push:
    branches: [main]
    paths: ['backends/python/**', '.github/workflows/data-safety.yml']
  pull_request:
    paths: ['backends/python/**', '.github/workflows/data-safety.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-recovery:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12']
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: ci-test-only
          POSTGRES_DB: hetu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backends/python
    env:
      DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/hetu_test
      HETU_TEST_DATABASE_URL: postgresql+asyncpg://postgres:ci-test-only@127.0.0.1:5432/hetu_test
      BACKUP_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/hetu_test
      RESTORED_DATABASE_URL: postgresql://postgres:ci-test-only@127.0.0.1:5432/hetu_restored
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: backends/python/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check app tests alembic scripts
      - run: ruff format --check app tests alembic scripts
      - run: alembic upgrade head
      - run: pytest
      - run: alembic check
      - name: Back up the disposable test database using its matching pg_dump
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir -p "$RUNNER_TEMP/hetu-pg-tools"
          printf '#!/bin/sh\nexec docker exec "$PG_CONTAINER" pg_dump -U postgres -d hetu_test "$@"\n' > "$RUNNER_TEMP/hetu-pg-tools/pg_dump"
          chmod +x "$RUNNER_TEMP/hetu-pg-tools/pg_dump"
          PATH="$RUNNER_TEMP/hetu-pg-tools:$PATH" python scripts/backup_database.py backup "$RUNNER_TEMP/hetu-backup"
      - name: Restore only into a new isolated database and compare all rows
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U postgres hetu_restored
          docker exec -i "$PG_CONTAINER" pg_restore -U postgres -d hetu_restored --no-owner --no-acl --exit-on-error --single-transaction < "$RUNNER_TEMP/hetu-backup/database.dump"
          python scripts/backup_database.py verify "$RUNNER_TEMP/hetu-backup"
