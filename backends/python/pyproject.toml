[project]
name = "hetu-api"
version = "1.0.0"
requires-python = ">=3.11,<3.13"
dependencies = [
  "alembic==1.16.5",
  "asyncpg==0.31.0",
  "boto3==1.42.97",
  "clerk-backend-api==4.2.0",
  "fastapi==0.128.8",
  "greenlet==3.5.6",
  "httpx==0.28.1",
  "orjson==3.11.5",
  "prometheus-client==0.26.0",
  "pydantic-settings==2.11.0",
  "python-multipart==0.0.20",
  "sentry-sdk[fastapi]==2.69.2",
  "SQLAlchemy==2.0.54",
  "structlog==25.5.0",
  "svix==2.5.0",
  "upstash-ratelimit==1.2.0",
  "upstash-redis==1.8.0",
  "uvicorn[standard]==0.39.0",
  "uvloop==0.22.1",
]

[tool.vercel]
entrypoint = "app.main:app"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q --strict-markers"
pythonpath = ["."]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]
ignore = ["B008"]

[tool.ruff.format]
quote-style = "double"
