<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/hetu-mark-192.png" />
    <link rel="apple-touch-icon" href="/hetu-apple-touch-icon.png" />
    <link rel="preload" as="image" href="/brand/hetu-mark.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f6f1e9" />
    <meta name="application-name" content="HETU" />
    <meta name="apple-mobile-web-app-title" content="HETU" />
    <meta
      name="description"
      content="HETU traces wrong, slow, and guessed GATE CS solves back to their cause, schedules focused re-attempts, and turns practice into evidence."
    />
    <script>
      (() => {
        let mode = 'system';
        try {
          const stored = JSON.parse(localStorage.getItem('air.prefs') || 'null');
          const preference = stored && stored.state && stored.state.colorTheme;
          if (preference === 'light' || preference === 'dark' || preference === 'system') {
            mode = preference;
          }
        } catch {
          // An invalid preference should never block the app shell.
        }
        const prefersDark = window.matchMedia
          ? window.matchMedia('(prefers-color-scheme: dark)').matches
          : false;
        const theme = mode === 'system' ? (prefersDark ? 'dark' : 'light') : mode;
        document.documentElement.dataset.theme = theme;
        document.querySelector('meta[name="theme-color"]').content =
          theme === 'dark' ? '#141113' : '#F6F1E9';
      })();
    </script>
    <title>HETU — Find the reason behind every mistake</title>
  </head>
  <body class="bg-bg text-text antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
