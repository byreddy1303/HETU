// Top-level build file where you can add configuration options common to all sub-projects/modules.

buildscript {
    
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.13.0'
        classpath 'com.google.gms:google-services:4.4.4'

        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

apply from: "variables.gradle"

allprojects {
    repositories {
        google()
        mavenCentral()
    }

    // Capacitor's generated Android test variants pull Kotlin 1.6 JDK
    // compatibility jars through coroutines while AndroidX resolves the
    // regular stdlib to 1.8.22. Keep those test-only classpaths on one
    // Kotlin generation so duplicate-class checks do not block emulator
    // smoke tests.
    configurations.configureEach {
        if (name.contains('AndroidTest')) {
            resolutionStrategy.eachDependency { details ->
                if (details.requested.group == 'org.jetbrains.kotlin') {
                    details.useVersion('1.8.22')
                }
            }
        }
    }
}

task clean(type: Delete) {
    delete rootProject.buildDir
}
